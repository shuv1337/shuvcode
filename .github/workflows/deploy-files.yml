name: deploy-files

on:
  push:
    branches:
      - dev
      - v2
  workflow_dispatch:

concurrency:
  group: deploy-files-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.repository == 'anomalyco/opencode' && (github.ref_name == 'dev' || github.ref_name == 'v2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Typecheck
        working-directory: services/files
        run: bun typecheck

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: anomalyco
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Deploy
        working-directory: services/files
        run: bun run deploy --stack anomalyco/files/${{ github.ref_name == 'v2' && 'production' || 'dev' }} --yes --non-interactive

name: publish
run-name: "${{ format('release {0}', inputs.version || inputs.bump) }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  version:
    if: github.repository == 'Latitudes-Dev/shuvcode' && github.ref_name == 'integration-v2'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Validate release input
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          if { [ -z "$BUMP" ] && [ -z "$VERSION" ]; } || { [ -n "$BUMP" ] && [ -n "$VERSION" ]; }; then
            echo "Provide exactly one of bump or version" >&2
            exit 1
          fi

      - name: Preflight all fork npm packages
        run: bun packages/cli/script/preflight-publish.ts

      - id: version
        run: ./script/version.ts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_BUMP: ${{ inputs.bump }}
          OPENCODE_VERSION: ${{ inputs.version }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}

  build-cli:
    needs: version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      # Upstream pins Bun canary here for its 1.4 features, but canary hangs the
      # web-ui Vite build on CI and stable Bun accepts the compiled execArgv, so
      # the fork builds with stable Bun and leaves BUN_COMPILE_RELEASE unset.
      - name: Build Bun CLI packages
        run: ./packages/cli/script/build.ts
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: ${{ needs.version.outputs.release }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shuvcode-cli
          path: packages/cli/dist/shuvcode-*
          if-no-files-found: error

  build-node-cli:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: linux-arm64
            host: blacksmith-4vcpu-ubuntu-2404-arm
          - target: linux-x64
            host: blacksmith-4vcpu-ubuntu-2404
          - target: darwin-arm64
            host: macos-26
          - target: windows-arm64
            host: blacksmith-4vcpu-windows-2025
          - target: windows-x64
            host: blacksmith-4vcpu-windows-2025
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --os=* --cpu=*

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.4.0"

      - name: Build Node CLI package
        run: bun packages/cli/script/build-node.ts --target=${{ matrix.settings.target }} --skip-install --outdir=dist/node
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: ${{ needs.version.outputs.release }}

      - name: Verify service lifecycle
        if: matrix.settings.target != 'windows-arm64'
        working-directory: packages/cli
        run: bun run script/service-smoke.ts --node

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shuvcode-node-cli-${{ matrix.settings.target }}
          path: packages/cli/dist/node/shuvcode-node-*
          if-no-files-found: error

  publish:
    needs:
      - version
      - build-cli
      - build-node-cli
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: shuvcode-cli
          path: packages/cli/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: shuvcode-node-cli-*
          path: packages/cli/dist/node
          merge-multiple: true

      - name: Configure GitHub Actions committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish fork release
        run: ./script/publish.ts
        env:
          GH_REPO: ${{ needs.version.outputs.repo }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: ${{ needs.version.outputs.release }}

  notify-discord:
    needs:
      - version
      - publish
    if: success()
    uses: ./.github/workflows/notify-discord.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
    continue-on-error: true

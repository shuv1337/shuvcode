name: publish
run-name: "${{ format('release {0}', inputs.version) }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 2.0.3-shuv.1)"
        required: true
        type: string
      channel:
        description: "npm dist-tag"
        required: false
        type: string
        default: latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  OPENCODE_VERSION: ${{ inputs.version }}
  OPENCODE_CHANNEL: ${{ inputs.channel || 'latest' }}
  OPENCODE_RELEASE: "1"

jobs:
  build-cli:
    if: github.repository == 'shuv1337/shuvcode'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.4.2"
          install-flags: --frozen-lockfile --os=* --cpu=*

      - name: Build Bun CLI packages
        run: bun packages/cli/script/build.ts
        env:
          BUN_COMPILE_RELEASE: bun-v1.4.2
          OPENCODE_VERSION: ${{ env.OPENCODE_VERSION }}
          OPENCODE_CHANNEL: ${{ env.OPENCODE_CHANNEL }}
          OPENCODE_RELEASE: ${{ env.OPENCODE_RELEASE }}

      - name: Stage Bun CLI artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shuvcode-cli"
          cp -a packages/cli/dist/shuvcode-* "$RUNNER_TEMP/shuvcode-cli/"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shuvcode-cli
          path: ${{ runner.temp }}/shuvcode-cli/
          if-no-files-found: error

  build-node-cli:
    if: github.repository == 'shuv1337/shuvcode'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.4.2"
          install-flags: --frozen-lockfile --os=* --cpu=*

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.4.0"

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install --yes unzip

      - name: Build Node CLI packages
        run: bun packages/cli/script/build-node.ts --skip-install --outdir=dist/node
        env:
          OPENCODE_VERSION: ${{ env.OPENCODE_VERSION }}
          OPENCODE_CHANNEL: ${{ env.OPENCODE_CHANNEL }}
          OPENCODE_RELEASE: ${{ env.OPENCODE_RELEASE }}

      - name: Stage Node CLI artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shuvcode-node-cli"
          cp -a packages/cli/dist/node/shuvcode-node-* "$RUNNER_TEMP/shuvcode-node-cli/"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shuvcode-node-cli
          path: ${{ runner.temp }}/shuvcode-node-cli/
          if-no-files-found: error

  # The GPT-Live voice plugin's native audio helper. The plugin downloads the asset for its
  # platform from this release on first use and checks it against gpt-live-host-SHA256SUMS.
  build-gpt-live-helper:
    if: github.repository == 'shuv1337/shuvcode'
    name: gpt-live-host ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-15, rust: aarch64-apple-darwin, smoke: true }
          - { target: darwin-x64, os: macos-15, rust: x86_64-apple-darwin, smoke: false }
          - { target: linux-x64, os: ubuntu-22.04, rust: x86_64-unknown-linux-gnu, smoke: true }
          - { target: linux-arm64, os: ubuntu-22.04-arm, rust: aarch64-unknown-linux-gnu, smoke: true }
          - { target: win32-x64, os: windows-2022, rust: x86_64-pc-windows-msvc, smoke: true }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: packages/gpt-live-plugin/native
          key: ${{ matrix.target }}

      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev pkg-config cmake

      - name: Build
        shell: bash
        env:
          GPT_LIVE_VERSION: ${{ inputs.version }}
        run: cargo build --release --locked --manifest-path packages/gpt-live-plugin/native/Cargo.toml --target ${{ matrix.rust }}

      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [[ "${{ matrix.target }}" == win32-* ]]; then ext=".exe"; fi
          mkdir -p "$RUNNER_TEMP/gpt-live-host"
          cp "packages/gpt-live-plugin/native/target/${{ matrix.rust }}/release/gpt-live-host$ext" \
            "$RUNNER_TEMP/gpt-live-host/gpt-live-host-${{ matrix.target }}$ext"

      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          ext=""
          if [[ "${{ matrix.target }}" == win32-* ]]; then ext=".exe"; fi
          "$RUNNER_TEMP/gpt-live-host/gpt-live-host-${{ matrix.target }}$ext" --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gpt-live-host-${{ matrix.target }}
          path: ${{ runner.temp }}/gpt-live-host/
          if-no-files-found: error

  publish:
    if: github.repository == 'shuv1337/shuvcode'
    permissions:
      contents: write
      id-token: write
    needs:
      - build-cli
      - build-node-cli
      - build-gpt-live-helper
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.4.2"
          install-flags: --frozen-lockfile

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install --yes zip

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: shuvcode-cli
          path: packages/cli/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: shuvcode-node-cli
          path: packages/cli/dist/node

      - name: Publish npm packages
        run: bun packages/cli/script/publish.ts
        env:
          OPENCODE_VERSION: ${{ env.OPENCODE_VERSION }}
          OPENCODE_CHANNEL: ${{ env.OPENCODE_CHANNEL }}
          OPENCODE_RELEASE: ${{ env.OPENCODE_RELEASE }}

      - name: Package GitHub release archives
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          shopt -s nullglob
          for dir in packages/cli/dist/shuvcode-*; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            case "$name" in
              *-node-*) continue ;;
            esac
            if [[ "$name" == *windows* ]]; then
              binary="shuvcode.exe"
            else
              binary="shuvcode"
            fi
            if [[ "$name" == *linux* ]]; then
              tar -czf "$RUNNER_TEMP/release-assets/${name}.tar.gz" -C "$dir/bin" "$binary"
            else
              (cd "$dir/bin" && zip -q "$RUNNER_TEMP/release-assets/${name}.zip" "$binary")
            fi
          done
          for dir in packages/cli/dist/node/shuvcode-node-*; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            if [[ "$name" == *windows* ]]; then
              binary="shuvcode-node.exe"
            else
              binary="shuvcode-node"
            fi
            if [[ "$name" == *linux* ]]; then
              tar -czf "$RUNNER_TEMP/release-assets/${name}.tar.gz" -C "$dir/bin" "$binary"
            else
              (cd "$dir/bin" && zip -q "$RUNNER_TEMP/release-assets/${name}.zip" "$binary")
            fi
          done
          ls -la "$RUNNER_TEMP/release-assets"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: gpt-live-host-*
          merge-multiple: true
          path: ${{ runner.temp }}/gpt-live-host

      - name: Stage GPT-Live helper assets
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gpt-live-host"
          sha256sum gpt-live-host-* > gpt-live-host-SHA256SUMS
          cat gpt-live-host-SHA256SUMS
          test "$(wc -l < gpt-live-host-SHA256SUMS)" -eq 5
          cp gpt-live-host-* "$RUNNER_TEMP/release-assets/"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ env.OPENCODE_CHANNEL }}
        run: |
          set -euo pipefail
          TAG="v${VERSION#v}"
          # Every fork version carries -shuv.N, so the dist-tag decides prerelease, not the version string.
          extra=()
          if [ "$CHANNEL" != "latest" ]; then extra+=(--prerelease); fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "shuvcode ${TAG}" \
            "${extra[@]}" \
            "$RUNNER_TEMP"/release-assets/*

  notify-discord:
    needs: publish
    if: success() && github.repository == 'shuv1337/shuvcode'
    uses: ./.github/workflows/notify-discord.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

name: discord-release

on:
  workflow_dispatch:
  release:
    types:
      - published
  workflow_run:
    workflows:
      - snapshot
    types:
      - completed
  push:
    branches:
      - integration-v2
    paths:
      - .github/workflows/discord-release.yml

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v3

      - name: Post shuvcode release notes to Discord
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: "1473184731037433929"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_TAG="v$(jq -r .version packages/cli/package.json)"
          api="https://discord.com/api/v10"
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/134.0.0.0 Safari/537.36'

          call() {
            local auth="$1"
            local path="$2"
            local method="${3:-GET}"
            local body="${4:-}"
            local bodyf code
            bodyf=$(mktemp)
            if [ -n "$body" ]; then
              code=$(curl -sS --http1.1 -o "$bodyf" -w '%{http_code}' \
                -X "$method" "$api$path" \
                -H "Authorization: $auth" \
                -H 'Accept: application/json' \
                -H 'Content-Type: application/json' \
                -H "User-Agent: $ua" \
                --data "$body")
            else
              code=$(curl -sS --http1.1 -o "$bodyf" -w '%{http_code}' \
                -X "$method" "$api$path" \
                -H "Authorization: $auth" \
                -H 'Accept: application/json' \
                -H 'Content-Type: application/json' \
                -H "User-Agent: $ua")
            fi
            printf '%s\n' "$code"
            cat "$bodyf"
            rm -f "$bodyf"
          }

          pick() {
            local body code auth label entry
            local pairs=(
              "user|$DISCORD_TOKEN"
              "bot|Bot $DISCORD_TOKEN"
              "bearer|Bearer $DISCORD_TOKEN"
            )
            for entry in "${pairs[@]}"; do
              IFS='|' read -r label auth <<< "$entry"
              mapfile -t out < <(call "$auth" /users/@me)
              code="${out[0]}"
              body="$(printf '%s\n' "${out[@]:1}")"
              echo "probe $label: $code" >&2
              { printf '%s\n' "$body" | head -c 200; echo; } >&2
              if [ "$code" = "200" ]; then
                echo "selected auth: $label" >&2
                printf '%s' "$auth"
                return 0
              fi
            done
            return 1
          }

          auth="$(pick)" || { echo "could not authenticate to Discord"; exit 1; }

          mapfile -t out < <(call "$auth" "/channels/$DISCORD_CHANNEL_ID")
          code="${out[0]}"
          body="$(printf '%s\n' "${out[@]:1}")"
          echo "channel lookup: $code"
          printf '%s\n' "$body" | head -c 300; echo
          [ "$code" = "200" ] || { echo "could not access target channel"; exit 1; }

          export RELEASE_JSON="$(gh release view "$RELEASE_TAG" --repo Latitudes-Dev/shuvcode --json tagName,body,url)"
          python - <<'PY' > /tmp/discord-payloads.jsonl
import json, os

data = json.loads(os.environ["RELEASE_JSON"])
tag = data["tagName"]
body = data.get("body") or ""
url = data["url"]
npm = f"https://www.npmjs.com/package/shuvcode/v/{tag.removeprefix('v')}"
parts = [f"**shuvcode {tag}** release notes\n\n[GitHub Release](<{url}>) | [npm](<{npm}>)"]
buf = ""
limit = 1900
for line in body.splitlines():
    add = (line or "") + "\n"
    if len(buf) + len(add) > limit:
        if buf.strip():
            parts.append(buf.rstrip())
        buf = add
    else:
        buf += add
if buf.strip():
    parts.append(buf.rstrip())
for part in parts:
    print(json.dumps({"content": part}))
PY

          while IFS= read -r payload; do
            mapfile -t out < <(call "$auth" "/channels/$DISCORD_CHANNEL_ID/messages" POST "$payload")
            code="${out[0]}"
            body="$(printf '%s\n' "${out[@]:1}")"
            echo "post: $code"
            printf '%s\n' "$body" | head -c 300; echo
            [[ "$code" = "200" || "$code" = "201" ]] || { echo "post failed"; exit 1; }
          done < /tmp/discord-payloads.jsonl
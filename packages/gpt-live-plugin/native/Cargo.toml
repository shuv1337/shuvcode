[package]
name = "gpt-live-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Native WebRTC and audio helper for the opencode-gpt-live plugin"
repository = "https://github.com/malhashemi/opencode-gpt-live"
publish = false

[[bin]]
name = "gpt-live-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
cpal = "=0.18.2"
futures = "0.3"
hound = "3.5"
opus = "=0.4.0"
rand = "0.9"
ringbuf = "0.4"
rtc = "=0.20.3"
rubato = { version = "=5.0.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonora = { version = "=0.2.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
webrtc = "=0.20.3"

# Lowering other apps' audio during calls (see src/duck.rs).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Foundation",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
